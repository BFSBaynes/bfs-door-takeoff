<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Elevate Trim - BFS</title>
  <style>
    :root{
      --navy:#0A2E4E;
      --bg:#f4f7f9;
      --cardRadius:12px;
    }
    *{ box-sizing:border-box; font-family: -apple-system, sans-serif; }
    body{ margin:0; background: var(--bg); padding: 10px; padding-bottom: 40px; }
    
    .header-card { background:#fff; border-radius: var(--cardRadius); padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: var(--navy); margin: 0 0 15px 0; font-size: 24px; text-align: center; }
    
    label { font-weight: 700; font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
    input, textarea { width:100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; margin-bottom: 10px; }

    .section-title { background: var(--navy); color: #fff; padding: 10px; border-radius: 8px; font-weight: 700; margin: 20px 0 10px 0; }
    
    /* New Mobile Stacked Layout */
    .door-row { 
      background: #fff; 
      border-radius: 10px; 
      padding: 12px; 
      margin-bottom: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .size-label { font-weight: 800; font-size: 18px; width: 50px; }
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-grow: 1; }
    
    .counter-box { display: flex; flex-direction: column; align-items: center; background: #f8f9fa; padding: 6px; border-radius: 6px; border: 1px solid #eee; }
    .counter-box label { font-size: 10px; margin-bottom: 4px; text-transform: uppercase; }
    
    .btn-wrap { display: flex; align-items: center; gap: 10px; }
    .btn { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--navy); color: white; font-weight: bold; font-size: 18px; }
    .qty { font-weight: 800; font-size: 16px; min-width: 15px; text-align: center; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .actionBtn { padding: 15px; border: 0; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; }
    .primary { background: var(--navy); color: white; }
    .secondary { background: #e2e8f0; color: var(--navy); }
    
    #summary { background: #fff; height: 180px; margin-top: 10px; font-family: monospace; }
  </style>
</head>
<body>

<div class="header-card">
  <h1>Elevate Trim</h1>
  <label>Customer</label>
  <input id="customer" type="text" placeholder="Pulte">
  <label>Lot # / Job Address</label>
  <input id="lot" type="text" placeholder="1405 Rowboat Rd">
</div>

<div id="app-content"></div>

<div class="header-card" style="margin-top:20px;">
  <div class="actions">
    <button class="actionBtn primary" onclick="generateSummary()">Generate Takeoff</button>
    <button class="actionBtn secondary" onclick="copySummary()">Copy to Clipboard</button>
  </div>
  <textarea id="summary" readonly placeholder="Your summary will appear here..."></textarea>
  <button class="actionBtn" style="width:100%; background:#fee2e2; color:#b91c1c; margin-top:10px;" onclick="location.reload()">Reset All</button>
</div>

<script>
  const doorSizes = ["1/6","1/8","1/10","2/0","2/4","2/6","2/8","2/10","3/0"];
  const dblSizes = ["4/0","4/8","5/0","6/0"];
  const state = {};

  function update(key, delta) {
    state[key] = Math.max(0, (state[key] || 0) + delta);
    document.getElementById(`qty-${key}`).innerText = state[key];
  }

  function renderSection(title, prefix, sizes, isSingle) {
    let html = `<div class="section-title">${title}</div>`;
    sizes.forEach(size => {
      html += `<div class="door-row">
        <div class="size-label">${size}</div>
        <div class="controls-grid">`;
      
      if(isSingle) {
        ['LH', 'RH'].forEach(hand => {
          let key = `${prefix}-${size}-${hand}`;
          html += `
            <div class="counter-box">
              <label>${hand}</label>
              <div class="btn-wrap">
                <button class="btn" onclick="update('${key}', -1)">-</button>
                <span class="qty" id="qty-${key}">0</span>
                <button class="btn" onclick="update('${key}', 1)">+</button>
              </div>
            </div>`;
        });
      } else {
        let key = `${prefix}-${size}-DBL`;
        html += `
          <div class="counter-box" style="grid-column: span 2;">
            <label>Double</label>
            <div class="btn-wrap">
              <button class="btn" onclick="update('${key}', -1)">-</button>
              <span class="qty" id="qty-${key}">0</span>
              <button class="btn" onclick="update('${key}', 1)">+</button>
            </div>
          </div>`;
      }
      html += `</div></div>`;
    });
    return html;
  }

  document.getElementById('app-content').innerHTML = 
    renderSection("6/8 Doors", "68", doorSizes, true) +
    renderSection("8/0 Doors", "80", doorSizes, true) +
    renderSection("Double Doors", "DBL", dblSizes, false);

  function generateSummary() {
    const cust = document.getElementById('customer').value;
    const lot = document.getElementById('lot').value;
    let output = `TAKEOFF: ${cust} ${lot}\n------------------\n`;
    
    let entries = [];
    // Sort keys to keep sizes organized
    Object.keys(state).sort().forEach(key => {
      if (state[key] > 0) {
        let [prefix, size, type] = key.split('-');
        entries.push(`${size} ${type} - ${state[key]}`);
      }
    });
    
    output += entries.length > 0 ? entries.join("\n") : "No items selected.";
    document.getElementById('summary').value = output;
  }

  function copySummary() {
    const ta = document.getElementById("summary");
    ta.select();
    ta.setSelectionRange(0, 99999);
    document.execCommand("copy");
    alert("Copied for AppWright!");
  }
</script>

</body>
</html>
