<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Elevate Trim - BFS</title>
  <style>
    :root{ --navy:#0A2E4E; --bg:#f4f7f9; }
    *{ box-sizing:border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body{ margin:0; background: var(--bg); padding: 8px; padding-bottom: 40px; }
    
    .header-card { background:#fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    h1 { color: var(--navy); margin: 0 0 10px 0; font-size: 20px; text-align: center; font-weight: 800; }
    label { font-weight: 700; font-size: 11px; color: #64748b; display: block; margin-bottom: 3px; text-transform: uppercase; }
    input, textarea { width:100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; margin-bottom: 10px; outline: none; }
    
    .section-title { background: var(--navy); color: #fff; padding: 8px 12px; font-weight: 700; font-size: 13px; margin: 12px -8px 8px -8px; position: sticky; top: 0; z-index: 100; }
    
    .door-row { background: #fff; border-radius: 8px; padding: 6px 10px; margin-bottom: 5px; display: flex; align-items: center; gap: 6px; border: 1px solid #e2e8f0; }
    .size-label { font-weight: 800; font-size: 12px; width: 60px; flex-shrink: 0; color: var(--navy); }
    
    .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(55px, 1fr)); gap: 4px; flex-grow: 1; }
    .counter-box { display: flex; flex-direction: column; align-items: center; background: #f8fafc; padding: 3px; border: 1px solid #e2e8f0; border-radius: 6px; }
    .counter-box label { font-size: 8px; margin-bottom: 2px; color: #94a3b8; }
    
    .btn-wrap { display: flex; align-items: center; gap: 4px; }
    /* SMALLER, COMPACT BUTTONS */
    .btn { 
      width: 26px; height: 26px; 
      border-radius: 4px; border: 0; 
      background: var(--navy); color: white; 
      font-weight: bold; font-size: 16px; 
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .qty { font-weight: 800; font-size: 14px; min-width: 14px; text-align: center; color: var(--navy); }
    
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .actionBtn { padding: 12px; border: 0; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
    #summary { background: #fff; height: 180px; margin-top: 10px; font-family: monospace; font-size: 12px; border: 1px solid #cbd5e1; width:100%; border-radius:6px; padding:8px; }
    .version-tag { text-align:center; color:#94a3b8; font-size:10px; margin-top:20px; }
  </style>
</head>
<body>

<div class="header-card">
  <h1>Elevate Trim</h1>
  <label>Job Information</label>
  <input id="job" type="text" placeholder="e.g. Pulte Huxley 104">
</div>

<div id="app-content"></div>

<div class="header-card" style="margin-top:15px;">
  <label>Takeoff Summary</label>
  <div class="actions">
    <button class="actionBtn" style="background:var(--navy); color:white;" onclick="generateSummary()">Generate</button>
    <button class="actionBtn" style="background:#e2e8f0; color:var(--navy);" onclick="copySummary()">Copy</button>
  </div>
  <textarea id="summary" readonly placeholder="Summary appears here..."></textarea>
  <button class="actionBtn" style="width:100%; background:#fee2e2; color:#b91c1c; margin-top:8px;" onclick="if(confirm('Clear all?')) location.reload()">Reset App</button>
</div>

<div class="version-tag">Version 1.0.71 - Anti-Zoom Fix</div>

<script>
  const state = {};

  function update(key, delta) {
    if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(8);
    state[key] = Math.max(0, (state[key] || 0) + delta);
    const el = document.getElementById('qty-' + key);
    if(el) el.innerText = state[key];
  }

  function renderRow(label, prefix, types) {
    let html = `<div class="door-row">
      <div class="size-label">${label}</div>
      <div class="controls-grid">`;
    types.forEach(type => {
      let key = prefix + '-' + label.replace(/'/g, "").replace(/\//g, "-") + '-' + type;
      html += `<div class="counter-box"><label>${type}</label>
        <div class="btn-wrap">
          <button class="btn" onclick="update('${key}', -1)">−</button>
          <span class="qty" id="qty-${key}">0</span>
          <button class="btn" onclick="update('${key}', 1)">+</button>
        </div>
      </div>`;
    });
    html += `</div></div>`;
    return html;
  }

  const doorSizes = ["1/6","1/8","1/10","2/0","2/4","2/6","2/8","2/10","3/0"];
  const dblSizes = ["4/0","4/8","5/0","5/4","6/0"];
  const railLengths = ["8'", "10'", "12'", "14'", "16'", "18'"];

  let html = `<div class="section-title">6/8 Doors</div>`;
  doorSizes.forEach(s => html += renderRow(s, "68", ["LH", "RH", "SLAB"]));

  html += `<div class="section-title">8/0 Doors</div>`;
  doorSizes.forEach(s => html += renderRow(s, "80", ["LH", "RH", "SLAB"]));

  html += `<div class="section-title">Double Doors</div>`;
  dblSizes.forEach(s => html += renderRow(s, "DBL", ["DBL", "T-AST", "FRENCH"]));

  html += `<div class="section-title">Handrail (Open vs Wall)</div>`;
  railLengths.forEach(s => html += renderRow(s, "HR", ["OPEN", "WALL"]));

  html += `<div class="section-title">Stair Hardware</div>`;
  html += renderRow("Newels", "ST", ["QTY"]);
  html += renderRow("Rosettes", "ST", ["QTY"]);
  html += renderRow("Brackets", "ST", ["QTY"]);
  html += renderRow("Balusters", "ST", ["QTY"]);
  html += renderRow("Shoes", "ST-SH", ["FLAT", "ANGLE"]);

  document.getElementById('app-content').innerHTML = html;

  function generateSummary() {
    let out = "TAKEOFF: " + document.getElementById('job').value + "\n------------------\n";
    let entries = [];
    Object.keys(state).forEach(key => {
      if(state[key] > 0) {
        let p = key.split('-');
        let d = "";
        if(p[0] === 'HR') d = p[1] + "' " + p[2] + " Rail";
        else if(p[0] === '68') d = p[1].replace('-', '/') + " 6/8 " + p[2];
        else if(p[0] === '80') d = p[1].replace('-', '/') + " 8/0 " + p[2];
        else if(p[0] === 'ST' && p[2] === 'QTY') d = p[1];
        else if(p[0] === 'ST-SH') d = "Shoes (" + p[2] + ")";
        else d = p[1].replace('-', '/') + " " + (p[2] === 'QTY' ? '' : p[2]);
        entries.push(d.trim() + " - " + state[key]);
      }
    });
    out += entries.length ? entries.join("\n") : "No selections.";
    document.getElementById('summary').value = out;
  }

  function copySummary() {
    const s = document.getElementById("summary");
    s.select();
    document.execCommand("copy");
    alert("Copied to Clipboard!");
  }
</script>
</body>
</html>
