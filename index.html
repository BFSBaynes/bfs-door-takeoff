<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Elevate Trim - BFS</title>
  <style>
    :root{ --navy:#0A2E4E; --bg:#f4f7f9; --cardRadius:12px; }
    *{ box-sizing:border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body{ margin:0; background: var(--bg); padding: 10px; padding-bottom: 40px; }
    
    .header-card, .door-row { 
      background:#fff; 
      border-radius: var(--cardRadius); 
      padding: 15px; 
      margin-bottom: 10px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.05); 
      border: 1px solid #e2e8f0;
    }
    
    h1 { color: var(--navy); margin: 0 0 15px 0; font-size: 24px; text-align: center; font-weight: 800; }
    label { font-weight: 700; font-size: 13px; color: #64748b; display: block; margin-bottom: 4px; text-transform: uppercase; }
    
    input, textarea { width:100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; margin-bottom: 12px; outline: none; }
    
    .section-title { 
      background: var(--navy); 
      color: #fff; 
      padding: 14px; 
      font-weight: 700; 
      margin: 20px -10px 12px -10px; 
      position: sticky; 
      top: 0; 
      z-index: 100; 
    }

    .door-row { display: flex; align-items: center; gap: 12px; }
    .size-label { font-weight: 800; font-size: 15px; width: 85px; flex-shrink: 0; color: var(--navy); }
    
    .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(75px, 1fr)); gap: 8px; flex-grow: 1; }
    
    .counter-box { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      background: #f8fafc; 
      padding: 6px; 
      border: 1px solid #e2e8f0; 
      border-radius: 10px; 
    }
    .counter-box label { font-size: 10px; margin-bottom: 6px; color: #94a3b8; }
    
    .btn-wrap { display: flex; align-items: center; gap: 8px; }
    .btn { 
      width: 34px; height: 34px; 
      border-radius: 50%; border: 0; 
      background: var(--navy); color: white; 
      font-weight: bold; font-size: 20px; 
      cursor: pointer; touch-action: manipulation; 
    }
    .qty { font-weight: 800; font-size: 16px; min-width: 20px; text-align: center; color: var(--navy); }
    
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .actionBtn { padding: 16px; border: 0; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; }
    .primary { background: var(--navy); color: white; }
    .secondary { background: #e2e8f0; color: var(--navy); }
    
    #summary { background: #fff; height: 250px; margin-top: 10px; font-family: monospace; font-size: 14px; border: 2px solid #e2e8f0; width:100%; padding:10px; }
    .version-tag { text-align:center; color:#94a3b8; font-size:11px; margin-top:30px; }
  </style>
</head>
<body>

<div class="header-card">
  <h1>Elevate Trim</h1>
  <label>Customer</label>
  <input id="customer" type="text" placeholder="e.g. Pulte">
  <label>Subdivision/Lot</label>
  <div style="display:flex; gap:10px;">
    <input id="subdivision" type="text" placeholder="Huxley" style="flex:2;">
    <input id="lot" type="text" placeholder="104" style="flex:1;">
  </div>
</div>

<div id="app-content"></div>

<div class="header-card" style="margin-top:20px;">
  <label>Special Notes</label>
  <textarea id="notes" style="height: 80px;" placeholder="e.g. Deliver to back porch..."></textarea>
  <div class="actions">
    <button class="actionBtn primary" onclick="generateSummary()">Generate Takeoff</button>
    <button class="actionBtn secondary" onclick="copySummary()">Copy to Clipboard</button>
  </div>
  <textarea id="summary" readonly></textarea>
  <button class="actionBtn" style="width:100%; background:#fee2e2; color:#b91c1c; margin-top:10px;" onclick="if(confirm('Clear all entries?')) location.reload()">Reset All</button>
</div>

<div class="version-tag">Version 1.0.67 - Logic Fix & UI Cleanup</div>

<script>
  const state = {};

  // FIXED: Logic now strictly uses the key to find the element
  function update(key, delta) {
    state[key] = Math.max(0, (state[key] || 0) + delta);
    const display = document.getElementById(`qty-${key}`);
    if (display) {
      display.innerText = state[key];
    }
  }

  function renderRow(label, prefix, types) {
    let html = `<div class="door-row">
      <div class="size-label">${label}</div>
      <div class="controls-grid">`;
    types.forEach(type => {
      // Logic key: Prefix + Label + Type (e.g., HR-8'-OPEN)
      let key = `${prefix}-${label}-${type}`;
      html += `<div class="counter-box">
        <label>${type}</label>
        <div class="btn-wrap">
          <button class="btn" onclick="update('${key}', -1)">-</button>
          <span class="qty" id="qty-${key}">0</span>
          <button class="btn" onclick="update('${key}', 1)">+</button>
        </div>
      </div>`;
    });
    html += `</div></div>`;
    return html;
  }

  const doorSizes = ["1/6","1/8","1/10","2/0","2/4","2/6","2/8","2/10","3/0"];
  const dblSizes = ["4/0","4/8","5/0","5/4","6/0"];
  const railLengths = ["8'", "10'", "12'", "14'", "16'", "18'"];

  let contentHtml = `<div class="section-title">6/8 Doors</div>`;
  doorSizes.forEach(s => contentHtml += renderRow(s, "68", ["LH", "RH", "SLAB"]));

  contentHtml += `<div class="section-title">8/0 Doors</div>`;
  doorSizes.forEach(s => contentHtml += renderRow(s, "80", ["LH", "RH", "SLAB"]));

  contentHtml += `<div class="section-title">Double Doors</div>`;
  dblSizes.forEach(s => contentHtml += renderRow(s, "DBL", ["DBL", "T-AST"]));

  contentHtml += `<div class="section-title">Attic Access</div>`;
  ["22x54", "25x54", "Scuttle"].forEach(s => contentHtml += renderRow(s, "AA", ["QTY"]));

  contentHtml += `<div class="section-title">Handrail (Open vs Wall)</div>`;
  railLengths.forEach(s => contentHtml += renderRow(s, "HR", ["OPEN", "WALL"]));

  contentHtml += `<div class="section-title">Stair Hardware</div>`;
  contentHtml += renderRow("Newels", "ST", ["QTY"]);
  contentHtml += renderRow("Rosettes", "ST", ["QTY"]);
  contentHtml += renderRow("Brackets", "ST", ["QTY"]);
  contentHtml += renderRow("Balusters", "ST", ["QTY"]);
  contentHtml += renderRow("Shoes", "ST-SH", ["FLAT", "ANGLE"]);

  document.getElementById('app-content').innerHTML = contentHtml;

  function generateSummary() {
    let out = `TAKEOFF: ${document.getElementById('customer').value} ${document.getElementById('subdivision').value} ${document.getElementById('lot').value}\n------------------\n`;
    let items = [];

    Object.keys(state).forEach(key => {
      if (state[key] > 0) {
        let parts = key.split('-');
        let display = "";
        
        if(parts[0] === 'HR') display = `${parts[1]} ${parts[2]} Rail`;
        else if(parts[0] === '68') display = `${parts[1]} 6/8 ${parts[2]}`;
        else if(parts[0] === '80') display = `${parts[1]} 8/0 ${parts[2]}`;
        else if(parts[0] === 'ST' && parts[1] === 'Shoes') display = `Shoes (${parts[2]})`;
        else display = `${parts[1]} ${parts[2] === 'QTY' ? '' : parts[2]}`;
        
        items.push(`${display.trim()} - ${state[key]}`);
      }
    });

    out += items.length ? items.join("\n") : "No items selected.";
    if (document.getElementById('notes').value) out += `\n------------------\nNOTES: ${document.getElementById('notes').value}`;
    document.getElementById('summary').value = out;
  }

  function copySummary() {
    const ta = document.getElementById("summary");
    ta.select();
    document.execCommand("copy");
    alert("Copied!");
  }
</script>
</body>
</html>
