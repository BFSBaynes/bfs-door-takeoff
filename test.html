<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elevate Trim – TEST</title>

<style>
:root{
  --navy:#0A2E4E;
  --red:#E31837;
  --bg:#e2e8f0;
  --green:#16a34a;
}

*{
  box-sizing:border-box;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
}

body{
  margin:0;
  background:var(--bg);
  padding:10px;
}

h1{
  text-align:center;
  color:var(--navy);
  margin-bottom:20px;
}

.section{
  background:#fff;
  border-radius:10px;
  padding:12px;
  margin-bottom:16px;
  box-shadow:0 4px 8px rgba(0,0,0,0.08);
}

.section-title{
  font-weight:800;
  font-size:16px;
  margin-bottom:10px;
  color:var(--navy);
  text-transform:uppercase;
}

.segment{
  display:flex;
  gap:6px;
  margin-bottom:12px;
}

.segment button{
  flex:1;
  padding:8px 0;
  font-weight:700;
  border-radius:6px;
  border:1px solid #cbd5e1;
  background:#f1f5f9;
}

.segment button.active{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.size{
  font-weight:800;
  width:70px;
  font-size:14px;
  color:var(--navy);
}

.counter{
  display:flex;
  align-items:center;
  gap:6px;
}

.btn{
  width:36px;
  height:36px;
  border-radius:6px;
  border:0;
  background:var(--navy);
  color:#fff;
  font-size:18px;
  font-weight:700;
}

.qty{
  font-weight:800;
  font-size:16px;
  min-width:18px;
  text-align:center;
}

.hidden{
  display:none;
}

@media (max-width:420px){
  .size{width:60px;font-size:13px;}
  .btn{width:34px;height:34px;}
}
</style>
</head>
<body>

<h1>Elevate Trim – TEST</h1>

<!-- 8/0 Doors -->
<div class="section" id="sec-80">
  <div class="section-title">8/0 Doors</div>

  <div class="segment">
    <button class="active" onclick="setSide('sec-80','LH',this)">LH</button>
    <button onclick="setSide('sec-80','RH',this)">RH</button>
  </div>

  <div class="row">
    <div class="size">1/6</div>
    <div class="counter">
      <button class="btn" onclick="update('80-1-6')">−</button>
      <div class="qty" id="80-1-6">0</div>
      <button class="btn" onclick="update('80-1-6',1)">+</button>
    </div>
  </div>

  <div class="row">
    <div class="size">2/0</div>
    <div class="counter">
      <button class="btn" onclick="update('80-2-0')">−</button>
      <div class="qty" id="80-2-0">0</div>
      <button class="btn" onclick="update('80-2-0',1)">+</button>
    </div>
  </div>

  <div class="row">
    <div class="size">2/4</div>
    <div class="counter">
      <button class="btn" onclick="update('80-2-4')">−</button>
      <div class="qty" id="80-2-4">0</div>
      <button class="btn" onclick="update('80-2-4',1)">+</button>
    </div>
  </div>
</div>

<script>
let state = {};

function update(id, add= -1){
  if(!state[id]) state[id]=0;
  state[id] = Math.max(0, state[id] + add);
  document.getElementById(id).innerText = state[id];
}

function setSide(sectionId, side, btn){
  const section = document.getElementById(sectionId);
  const buttons = section.querySelectorAll('.segment button');
  buttons.forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
</script>

</body>
</html>
