<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Elevate Trim - BFS</title>
  <style>
    :root{ --navy:#0A2E4E; --bfs-red:#E31837; --bg:#cbd5e1; --accent: #1e40af; --slate: #334155; --green: #16a34a; }
    *{ box-sizing:border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    body{ margin:0; background: var(--bg); padding: 8px; padding-bottom: 50px; overflow-x: hidden; }
    
    .header-card { background:#fff; border-radius: 8px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #94a3b8; text-align: center; }
    .app-logo { width: 160px; height: auto; margin: 5px auto; display: block; }
    
    label { font-weight: 700; font-size: 10px; color: #475569; display: block; margin-bottom: 3px; text-transform: uppercase; text-align: left; }
    input, textarea { width:100%; padding: 10px; border: 1px solid #94a3b8; border-radius: 6px; font-size: 16px; margin-bottom: 8px; outline: none; background: #fff; }
    
    .section-title { 
      color: #fff; padding: 14px; font-weight: 800; font-size: 14px; 
      margin: 8px -8px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      text-transform: uppercase; border-bottom: 3px solid rgba(0,0,0,0.2);
      position: sticky; top: 0; z-index: 100;
    }
    .bg-navy { background: var(--navy); }
    .bg-red { background: var(--bfs-red); }
    
    .section-content { display: none; padding-top: 8px; }
    .section-content.active { display: block; }
    
    /* THE CLEAN ROW */
    .door-row { 
      background: #fff; border-radius: 6px; padding: 8px; 
      margin-bottom: 8px; display: flex; align-items: center; gap: 10px; 
      border: 1px solid #94a3b8; 
    }

    .label-col { width: 75px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .size-label { font-weight: 900; font-size: 13px; color: var(--navy); }
    
    .slab-trigger { 
      font-size: 9px; font-weight: 800; padding: 4px; border-radius: 4px; 
      border: 1px solid var(--navy); background: #f1f5f9; color: var(--navy); 
      text-align: center; cursor: pointer;
    }
    .slab-active { background: var(--green); color: white; border-color: var(--green); }

    .controls-grid { display: grid; gap: 6px; flex: 1; grid-template-columns: 1fr 1fr; }
    
    .counter-box { 
        display: flex; flex-direction: column; align-items: center; background: #fdfdfd; 
        padding: 4px; border: 1px solid #e2e8f0; border-radius: 4px; 
    }

    .counter-box label { font-size: 9px; margin-bottom: 2px; color: #64748b; font-weight: 900; }
    .btn-wrap { display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; }
    
    .btn { width: 34px; height: 34px; border-radius: 6px; border: 0; background: var(--navy); color: white; font-weight: bold; font-size: 20px; }
    
    .qty { font-weight: 800; font-size: 16px; min-width: 20px; text-align: center; color: var(--navy); }
    .has-qty { color: var(--green) !important; }

    .note-box { width: 95%; height: 22px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 3px; padding: 2px; font-size: 9px; text-align: center; margin-top: 4px; }
    
    /* MODAL STYLES */
    .modal-overlay { 
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; 
    }
    .modal-content { 
      background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; 
      text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .modal-header { font-weight: 900; color: var(--navy); margin-bottom: 15px; font-size: 18px; }

    .version-tag { text-align:center; color:#475569; font-size:9px; margin: 20px 0; font-weight: bold; }
  </style>
</head>
<body>

<div class="header-card">
  <img src="icon-512.png" alt="Elevate Trim Logo" class="app-logo">
  <div class="input-row" style="display:flex; gap:8px;">
    <div style="flex:1"><label>Customer</label><input id="customer" type="text"></div>
    <div style="flex:1"><label>Subdivision</label><input id="subdivision" type="text"></div>
  </div>
  <div class="input-row" style="display:flex; gap:8px;">
    <div style="flex:1"><label>Lot #</label><input id="lot" type="text"></div>
    <div style="flex:1"><label>Plan</label><input id="plan" type="text"></div>
  </div>
</div>

<div id="app-content"></div>

<div id="slabModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header" id="modalTitle">Add Slab</div>
    <div class="counter-box" style="padding: 15px; border: 2px solid var(--navy);">
      <label>Slab Quantity</label>
      <div class="btn-wrap">
        <button class="btn" onclick="updateSlab(-1)">−</button>
        <span class="qty" id="modalQty">0</span>
        <button class="btn" onclick="updateSlab(1)">+</button>
      </div>
      <input type="text" id="modalNote" class="note-box" style="height:40px; font-size:14px; margin-top:15px;" placeholder="Slab Notes...">
    </div>
    <button class="actionBtn" style="width:100%; background:var(--navy); color:white; margin-top:15px; padding:12px; border-radius:8px; font-weight:bold;" onclick="closeSlabModal()">Save & Close</button>
  </div>
</div>

<div class="header-card" style="margin-top:15px;">
  <button class="actionBtn" style="width:100%; background:var(--navy); color:white; padding:15px; border-radius:8px; font-weight:800;" onclick="generateSummary()">Generate Takeoff</button>
  <textarea id="summary" readonly style="margin-top:10px; height:200px; font-family:monospace;"></textarea>
  <button class="actionBtn" style="width:100%; background:#fee2e2; color:#b91c1c; margin-top:8px; border:0; padding:10px;" onclick="location.reload()">Reset All</button>
</div>

<div class="version-tag">Version 1.3.6 - Slab Modal Edition</div>

<script>
  const state = {};
  let currentSlabKey = "";
  const doorSizes = ["1/4","1/6","1/8","1/10","2/0","2/4","2/6","2/8","2/10","3/0"];
  const dblSizes = ["4/0","4/8","5/0","5/4","6/0"];

  function update(key, delta) {
    state[key] = Math.max(0, (state[key] || 0) + delta);
    const el = document.getElementById('qty-' + key);
    if(el) {
      el.innerText = state[key];
      state[key] > 0 ? el.classList.add('has-qty') : el.classList.remove('has-qty');
    }
  }

  function openSlabModal(key, label) {
    currentSlabKey = key;
    document.getElementById('modalTitle').innerText = label + " Slab";
    document.getElementById('modalQty').innerText = state[key] || 0;
    document.getElementById('modalNote').value = document.getElementById('NOTE_' + key)?.value || "";
    document.getElementById('slabModal').style.display = 'flex';
  }

  function updateSlab(delta) {
    let val = Math.max(0, (parseInt(document.getElementById('modalQty').innerText) || 0) + delta);
    document.getElementById('modalQty').innerText = val;
  }

  function closeSlabModal() {
    const val = parseInt(document.getElementById('modalQty').innerText) || 0;
    state[currentSlabKey] = val;
    
    // Hidden note storage
    let noteInput = document.getElementById('NOTE_' + currentSlabKey);
    if (!noteInput) {
        noteInput = document.createElement('input');
        noteInput.type = 'hidden';
        noteInput.id = 'NOTE_' + currentSlabKey;
        document.body.appendChild(noteInput);
    }
    noteInput.value = document.getElementById('modalNote').value;

    const trigger = document.getElementById('trigger-' + currentSlabKey);
    val > 0 ? trigger.classList.add('slab-active') : trigger.classList.remove('slab-active');
    
    document.getElementById('slabModal').style.display = 'none';
  }

  function toggleSection(id, headerEl) {
    document.getElementById('content-' + id).classList.toggle('active');
  }

  function renderRow(label, prefix, types) {
    let displayLabel = prefix.includes("80") ? label + "x8/0" : label;
    let slabKey = prefix + '_' + label.replace(/\//g, "-") + '_SLAB';

    let html = `<div class="door-row">
      <div class="label-col">
        <div class="size-label">${displayLabel}</div>
        <div class="slab-trigger" id="trigger-${slabKey}" onclick="openSlabModal('${slabKey}', '${displayLabel}')">Add Slab</div>
      </div>
      <div class="controls-grid">`;
    
    ["LH", "RH"].forEach(type => {
      let key = prefix + '_' + label.replace(/\//g, "-") + '_' + type;
      html += `<div class="counter-box"><label>${type}</label>
        <div class="btn-wrap">
          <button class="btn" onclick="update('${key}', -1)">−</button>
          <span class="qty" id="qty-${key}">0</span>
          <button class="btn" onclick="update('${key}', 1)">+</button>
        </div>
        <input type="text" id="NOTE_${key}" class="note-box" placeholder="Note">
      </div>`;
    });
    return html + `</div></div>`;
  }

  const layout = [
    { title: "6/8 Doors", id: "68_s", color: "bg-navy", rows: () => doorSizes.map(s => renderRow(s, "68", ["LH", "RH"])).join('') },
    { title: "8/0 Doors", id: "80_s", color: "bg-navy", rows: () => doorSizes.map(s => renderRow(s, "80", ["LH", "RH"])).join('') }
  ];

  document.getElementById('app-content').innerHTML = layout.map(sec => `
    <div class="section-title ${sec.color}" onclick="toggleSection('${sec.id}', this)">
      <span>${sec.title}</span><span>▼</span>
    </div>
    <div id="content-${sec.id}" class="section-content">${sec.rows()}</div>
  `).join('');

  function generateSummary() {
    let out = `TAKEOFF SUMMARY\n----------------\n`;
    for (let key in state) {
      if (state[key] > 0) {
        let note = document.getElementById('NOTE_' + key)?.value;
        out += `${key.replace(/_/g, ' ')}: ${state[key]} ${note ? '(' + note + ')' : ''}\n`;
      }
    }
    document.getElementById('summary').value = out;
  }
</script>
</body>
</html>
